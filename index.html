<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c894f3">
<title>FREE FLOW — 一口自由</title>
<style>
  :root { color-scheme: light; --ink: #37116a; --muted: #e0c9ff; --lime: #ffe44b; --pink: #ff68b9; --aqua: #42edee; --paper: #fff9ff; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--paper); background: #c894f3; background-image: radial-gradient(#eed4ff 2px, transparent 2px), linear-gradient(135deg, #a579f0, #e9b7f6); background-size: 26px 26px, 100% 100%; font: 15px/1.65 'Arial Rounded MT Bold', 'PingFang TC', system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--aqua); outline-offset: 5px; }
  .shell { max-width: 1230px; margin: auto; padding: 22px 38px 20px; }
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 3px solid #fff9ff88; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 900; letter-spacing: .13em; color: var(--ink); }
  .mark { width: 32px; height: 32px; border: 3px solid var(--paper); border-radius: 11px; display: grid; place-items: center; color: var(--paper); background: #803bdf; box-shadow: 3px 3px 0 var(--ink); font-size: 22px; transform: rotate(-8deg); }
  .prototype { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 20px; padding: 4px 11px; font-size: 10px; font-weight: 800; letter-spacing: .1em; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 28px; padding-top: 24px; }
  .stage { position: relative; min-width: 0; height: min(760px, calc(100dvh - 140px)); min-height: 490px; border: 5px solid var(--paper); border-radius: 24px; box-shadow: 0 0 0 3px var(--ink), 8px 9px 0 #6525a988; overflow: hidden; background: #351572; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .stage-tag { position: absolute; left: 16px; top: 14px; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); font-size: 10px; font-weight: 900; letter-spacing: .1em; pointer-events: none; box-shadow: 3px 3px 0 #37116a66; }
  aside { display: flex; flex-direction: column; padding: 18px 18px 14px; border: 4px solid var(--paper); border-radius: 24px; background: #6427bc; box-shadow: 0 0 0 3px var(--ink), 7px 8px 0 #6525a988; }
  h1 { font: 1000 clamp(54px, 5.8vw, 76px)/.95 'Arial Rounded MT Bold', system-ui, sans-serif; letter-spacing: -.065em; margin: 0 0 18px -3px; color: var(--lime); -webkit-text-stroke: 2px var(--paper); paint-order: stroke fill; text-shadow: 4px 5px 0 var(--ink); transform: rotate(-3deg); }
  h1 span { display: block; color: var(--pink); }
  .subtitle { font-size: 22px; font-weight: 900; letter-spacing: .1em; margin: 0 0 12px; }
  .organ-feel { color: var(--aqua); font-size: 11px; margin: 10px 0 0; }
  .route { display: flex; justify-content: space-between; gap: 5px; margin-top: 17px; color: var(--paper); font-size: 10px; font-weight: 800; }
  .route span { padding: 3px 0; border: 2px solid #bb83f0; border-radius: 8px; flex: 1; text-align: center; }
  .route span.current { border-color: var(--paper); color: var(--ink); background: var(--lime); box-shadow: 2px 2px 0 var(--ink); }
  .route span.passed { background: #a348ce; }
  .stats { border-top: 2px dashed #c997f0; margin-top: 22px; padding-top: 16px; }
  .stat-row { display: flex; align-items: baseline; justify-content: space-between; }
  .label { color: var(--paper); font-size: 11px; font-weight: 800; letter-spacing: .04em; }
  .number { font-size: 29px; font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--lime); text-shadow: 2px 2px 0 var(--ink); }
  .number small { font-size: 12px; color: var(--paper); }
  .track { height: 10px; background: var(--ink); border: 2px solid var(--paper); border-radius: 8px; margin: 9px 0 18px; overflow: hidden; }
  .fill { width: 0; height: 100%; background: var(--lime); }
  #air-fill { background: var(--aqua); }
  .irritation-row { color: #ffdded; font-size: 10px; }
  .irritation-row .track { margin: 7px 0 12px; }
  #irritation-fill { background: #ff6b8f; }
  .overlay.failure .big { color: var(--pink); }
  .breath-state { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 800; color: var(--aqua); min-height: 30px; }
  .dot { width: 9px; height: 9px; flex-shrink: 0; border: 2px solid var(--paper); border-radius: 50%; background: currentColor; }
  .controls { margin-top: auto; }
  #breath { width: 100%; background: var(--lime); color: var(--ink); border: 4px solid var(--paper); border-radius: 17px; box-shadow: 0 0 0 2px var(--ink), 0 6px 0 var(--ink); padding: 12px 10px; touch-action: none; user-select: none; -webkit-user-select: none; transition: background .15s, transform .1s; }
  #breath.active { background: var(--pink); transform: translateY(3px); box-shadow: 0 0 0 2px var(--ink), 0 3px 0 var(--ink); }
  #breath.forced { background: var(--aqua); }
  #breath strong { display: block; font-size: 20px; font-weight: 900; letter-spacing: .04em; }
  .keyhint { text-align: center; color: var(--muted); font-size: 10px; margin: 12px 0 10px; }
  kbd { border: 2px solid var(--paper); background: var(--ink); color: var(--paper); border-radius: 5px; padding: 1px 6px; font: inherit; }
  .bottom-row { display: flex; justify-content: space-between; align-items: center; }
  #reset { background: none; color: var(--paper); border: 0; padding: 3px 0; font-size: 11px; font-weight: 800; }
  #reset:hover { color: var(--lime); }
  #practice, #duo { border: 2px solid var(--paper); border-radius: 8px; background: #8c49d7; color: var(--paper); padding: 2px 7px; font-size: 10px; font-weight: 800; }
  #time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #481581ed; padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay .big { font-size: 68px; line-height: 1; color: var(--lime); font-weight: 1000; letter-spacing: -.06em; -webkit-text-stroke: 3px var(--paper); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--ink); transform: rotate(-5deg); }
  .overlay p { color: var(--paper); }
  .overlay button { border: 4px solid var(--paper); border-radius: 13px; background: var(--lime); color: var(--ink); padding: 12px 25px; margin: auto; font-weight: 900; box-shadow: 4px 5px 0 var(--ink); }
  footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 17px; font-size: 10px; font-weight: 800; color: var(--ink); letter-spacing: .06em; }
  @media (max-width: 760px) {
    .shell { padding: 14px 16px; }
    header { padding-bottom: 12px; }
    .prototype { font-size: 8px; padding: 3px 7px; }
    main { grid-template-columns: minmax(0, 1fr) 200px; gap: 17px; padding-top: 18px; }
    .stage { height: 630px; min-height: 0; }
    aside { padding: 12px; }
    h1 { font-size: 50px; }
    .subtitle { font-size: 17px; }
    .stats { margin-top: 18px; }
    .stage-tag { left: 10px; font-size: 8px; }
  }
  @media (max-width: 520px) {
    main { display: flex; flex-direction: column; gap: 15px; }
    .stage { order: 1; height: min(46dvh, 500px); min-height: 280px; border-width: 4px; border-radius: 19px; }
    aside { display: contents; }
    .title-block { order: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 0 15px; color: var(--ink); }
    h1 { font-size: 39px; margin: 0; }
    .subtitle { margin: 0; font-size: 16px; }
    .route, .organ-feel { display: none; }
    .stats { order: 2; margin: 0; padding: 10px 12px; border: 3px solid var(--paper); border-radius: 15px; background: #6427bc; display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; box-shadow: 3px 3px 0 var(--ink); }
    .track { margin: 7px 0 6px; height: 8px; }
    .number { font-size: 22px; }
    .breath-state { font-size: 10px; min-height: 22px; }
    .controls { order: 3; position: sticky; bottom: 0; background: #c894f3; padding: 7px 2px 10px; border-radius: 15px 15px 0 0; }
    #breath { padding: 9px; border-width: 3px; }
    #breath strong { font-size: 17px; }
    .keyhint { display: none; }
    .bottom-row { margin-top: 9px; }
    #reset, #time { color: var(--ink); }
    footer { margin-top: 5px; font-size: 8px; }
    .stage-tag { padding: 2px 7px; top: 9px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><span class="mark">≈</span> FAUST GAME JAM</div><div class="prototype">ONE BUTTON / PROTOTYPE 15</div></header>
  <main>
    <section class="stage" aria-label="從肺部到鼻腔的長途關卡">
      <canvas id="game" aria-label="按住空白鍵吐氣，放開吸氣，將黃色異物從上方排出。">請使用支援 Canvas 的瀏覽器。</canvas>
      <div class="stage-tag" id="area">01 / 肺部 · LUNGS</div>
      <div class="overlay" id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
        <div class="big" id="win-title">通關</div>
        <p id="result"></p><button id="again">↻ 重試</button>
      </div>
    </section>
    <aside>
      <div class="title-block"><h1>FREE<span>FLOW.</span></h1><p class="subtitle" id="subtitle">一口自由</p></div>
      <p class="organ-feel" id="organ-feel">肺泡 · 支氣管</p>
      <div class="route" aria-label="旅程"><span>肺部</span><span>氣管</span><span>咽喉</span><span>鼻腔</span></div>
      <div class="stats">
        <div><div class="stat-row"><span class="label" id="progress-label">進度</span><span class="number"><span id="progress">0</span><small> %</small></span></div><div class="track"><div class="fill" id="progress-fill"></div></div></div>
        <div><div class="stat-row"><span class="label">氣量</span><span class="number"><span id="air">100</span><small> %</small></span></div><div class="track"><div class="fill" id="air-fill"></div></div></div>
        <div class="irritation-row"><span>刺激 <b id="irritation">0</b> / 100</span><div class="track"><div class="fill" id="irritation-fill"></div></div></div>
        <div class="breath-state"><span class="dot"></span><span id="state" role="status">待機</span></div>
      </div>
      <div class="controls">
        <button id="breath" aria-label="按住吐氣，放開吸氣" aria-describedby="state"><strong id="button-label">↑ 吐氣</strong></button>
        <p class="keyhint"><kbd>SPACE</kbd></p>
        <div class="bottom-row"><button id="reset">↻ 重來</button><button id="practice">吸氣練習</button><button id="duo">雙異物</button><span id="time">00:00</span></div>
      </div>
    </aside>
  </main>
  <footer><span>自由流動 / FREE FLOW</span><span>肺部 → 氣管 → 咽喉 → 鼻腔</span></footer>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const art={ink:'#37116a',paper:'#fff9ff',yellow:'#ffe44b',pink:'#ff68b9',cyan:'#42edee'};
  const W = 640, H = 7000, VIEW = 960, START = 6600, EXIT = 90, STEP = 1 / 120;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const outline=[[-24,-4],[-12,-15],[4,-12],[22,-1],[11,13],[-6,16],[-19,7]].map(([x,y])=>({x,y}));
  let twiceArea=0,cx=0,cy=0;
  for(let i=0;i<outline.length;i++) {
    const a=outline[i],b=outline[(i+1)%outline.length],cross=a.x*b.y-a.y*b.x;
    twiceArea+=cross;cx+=(a.x+b.x)*cross;cy+=(a.y+b.y)*cross;
  }
  for(const p of outline){p.x-=cx/(3*twiceArea);p.y-=cy/(3*twiceArea);}
  const BR=Math.max(...outline.map(p=>Math.hypot(p.x,p.y)));
  let inertia=0;
  for(let i=0;i<outline.length;i++) {
    const a=outline[i],b=outline[(i+1)%outline.length],cross=a.x*b.y-a.y*b.x;
    inertia+=cross*(a.x*a.x+a.x*b.x+b.x*b.x+a.y*a.y+a.y*b.y+b.y*b.y);
  }
  inertia/=6*twiceArea;
  const profiles = [[40,320,390],[380,315,400],[700,305,430],[1100,325,460],[1450,320,470],[1700,320,390],[1850,340,350],[2150,365,430],[2550,280,460],[3000,350,470],[3300,320,250],[3850,320,240],[4250,320,240],[4320,320,240],[4420,340,340],[4510,330,380],[4660,320,270],[4700,320,240],[5150,320,240],[5400,320,180],[5650,320,225],[5900,320,390],[6200,320,525],[6550,320,515],[6800,320,430],[7000,320,310]];
  const obstacles = [
    { id:'bronchus', y:5680, side:'left', gap:96, name:'魚刺', kind:'shelf', material:'fishbone' },
    { id:'trachea', y:4830, side:'right', gap:92, name:'倒鉤魚刺', kind:'shelf', material:'fishbone' },
    { id:'neck', y:4320, gap:35, name:'喉頭窄口', kind:'neck' },
    { id:'vocal', y:3690, name:'聲帶', kind:'gate' },
    { id:'membrane', y:3160, name:'咽喉薄膜', kind:'valve', window:[.32,.62], openUntil:0 },
    { id:'throat', y:2880, side:'left', gap:76, name:'會厭軟瓣', kind:'shelf', material:'soft' },
    { id:'fish-throat', y:2520, side:'right', gap:100, name:'咽喉魚刺', kind:'shelf', material:'fishbone' },
    { id:'palate', y:2170, side:'right', gap:74, name:'軟顎彎道', kind:'shelf', material:'soft' },
    { id:'nasopharynx', y:1780, name:'鼻咽軟組織', kind:'valve', window:[.85,1.15], openUntil:0 },
    { id:'nasal1', y:1360, side:'left', gap:70, name:'下鼻甲', kind:'shelf', material:'turbinate' },
    { id:'nasal2', y:985, side:'left', gap:66, name:'中鼻甲', kind:'shelf', material:'turbinate' },
    { id:'nasal3', y:610, side:'left', gap:64, name:'上鼻甲', kind:'shelf', material:'turbinate' }
  ];
  const neck=obstacles.find(o=>o.kind==='neck');
  function bounds(y) {
    let c=profiles.at(-1)[1], width=profiles.at(-1)[2];
    for(let i=1;i<profiles.length;i++) if(y<=profiles[i][0]) {
      const a=profiles[i-1], b=profiles[i], t=clamp((y-a[0])/(b[0]-a[0]),0,1), s=t*t*(3-2*t);
      c=a[1]+(b[1]-a[1])*s; width=a[2]+(b[2]-a[2])*s; break;
    }
    const trachea=clamp((y-3350)/180,0,1)*clamp((5400-y)/180,0,1);
    c+=Math.sin(y*.008)*15*(1-trachea);
    width-=trachea*(11+11*Math.cos(y*Math.PI*2/105));
    const fold=y<1700?10:6;
    return [c-width/2+Math.sin(y*.023)*fold*(1-trachea),c+width/2+Math.sin(y*.019)*fold*(1-trachea)];
  }
  const center = y => { const [l,r]=bounds(y); return (l+r)/2; };
  function lungSplit(y) {
    const half=clamp((y-6020)/280,0,1)*(56+10*Math.sin(y*.007));
    return [center(y)-half,center(y)+half];
  }
  function nasalSplit(y) {
    const half=22*Math.min(clamp((y-120)/100,0,1),clamp((1650-y)/110,0,1));
    return [center(y)-half,center(y)+half];
  }
  function dividerPolygon(top,bottom,split) {
    const a=[],b=[];for(let y=top;y<=bottom;y+=10){const [l,r]=split(y);a.push({x:l,y});b.push({x:r,y});}
    return [...a,...b.reverse()];
  }
  const pocket={x:175,top:6385,floor:6420,width:64,gap:16};
  const pocketRects=[{x:pocket.x-pocket.width/2,y:pocket.top,w:7,h:pocket.floor-pocket.top+3},
    {x:pocket.x+pocket.width/2-7,y:pocket.top,w:7,h:pocket.floor-pocket.top+3},
    {x:pocket.x-pocket.width/2,y:pocket.floor,w:(pocket.width-pocket.gap)/2,h:.5},
    {x:pocket.x+pocket.gap/2,y:pocket.floor,w:(pocket.width-pocket.gap)/2,h:.5}];
  const pocketShapes=pocketRects.map(r=>[{x:r.x,y:r.y},{x:r.x+r.w,y:r.y},{x:r.x+r.w,y:r.y+r.h},{x:r.x,y:r.y+r.h}]);
  pocketShapes[2][3].y+=24;pocketShapes[3][2].y+=24;
  const pocketAttachment=[{x:pocket.x-pocket.width/2,y:pocket.top+12},{x:bounds(pocket.top+12)[0]-12,y:pocket.top+2},
    {x:bounds(pocket.floor)[0]-12,y:pocket.floor-5},{x:pocket.x-pocket.width/2,y:pocket.floor+6}];
  pocketShapes.push(pocketAttachment);
  const pocketLining=[[{x:pocket.x-pocket.width/2,y:pocket.top},{x:pocket.x-pocket.width/2+7,y:pocket.top},
    {x:pocket.x-pocket.width/2+7,y:pocket.floor},{x:pocket.x-pocket.gap/2,y:pocket.floor},
    {x:pocket.x-pocket.gap/2,y:pocket.floor+.5},{x:pocket.x-pocket.width/2,y:pocket.floor+24.5}]];
  pocketLining.push(pocketLining[0].map(p=>({x:2*pocket.x-p.x,y:p.y})));
  const inPocket=(x,y)=>duoMode&&x>pocket.x-pocket.width/2+7&&x<pocket.x+pocket.width/2-7&&y>=pocket.top&&y<=pocket.floor+3;
  const structures=[{id:'lung-fissure',top:6020,bottom:6900,points:dividerPolygon(6020,6900,lungSplit)},
    {id:'nasal-septum',top:120,bottom:1650,points:dividerPolygon(120,1650,nasalSplit)}];
  function laneBounds(y,lane='left') {
    const [l,r]=bounds(y),[a,b]=nasalSplit(y);return lane==='left'?[l,a]:[b,r];
  }
  function obstacleSide(o) {return o.material==='turbinate'&&nasalLane==='right'?(o.side==='left'?'right':'left'):o.side;}
  function shelfShape(o,lane='left') {
    const nasal=o.material==='turbinate',side=o.side, [l,r]=nasal?laneBounds(o.y):bounds(o.y);
    const dir=side==='left'?1:-1,root=side==='left'?l-32:r+32,tip=side==='left'?r-o.gap:l+o.gap;
    let coords;
    if(o.material==='fishbone')coords=[[root,-5],[tip,-2],[tip+dir*10,0],[tip,2],[root,5]];
    else if(o.material==='soft')coords=[[root,-95],[tip-dir*68,-55],[tip-dir*13,-24],[tip,0],[tip-dir*9,23],[tip-dir*55,42],[root,82]];
    else if(nasal) {
      const height=o.id==='nasal1'?92:o.id==='nasal2'?78:62;
      coords=[[root,-height],[tip-dir*52,-height+8],[tip-dir*18,-height*.55],[tip-dir*4,-24],[tip,0],
        [tip-dir*8,34],[tip-dir*24,48],[tip-dir*47,45],[tip-dir*58,27],[tip-dir*46,8],
        [tip-dir*29,10],[tip-dir*26,24],[tip-dir*38,29],[root,height*.7]];
    }
    else if(o.material==='cartilage')coords=[[root,-45],[tip-dir*18,-34],[tip,-16],[tip,16],[tip-dir*18,34],[root,45]];
    else coords=[[root,-27],[tip-dir*45,-25],[tip-dir*9,-19],[tip,0],[tip-dir*7,24],[tip-dir*40,32],[root,30]];
    let points=coords.map(([x,dy])=>({x,y:o.y+dy}));
    if(nasal&&lane==='right')points=points.map(p=>({x:2*center(o.y)-p.x,y:p.y}));
    return points;
  }

  function fishbonePieces(o) {
    const shaft=shelfShape(o),root=shaft[0].x,tip=shaft[2].x,dir=o.side==='left'?1:-1,pieces=[shaft];
    for(let i=1;i<=5;i++) {
      const x=root+(tip-root)*i/6;
      for(const sign of [-1,1])pieces.push([{x:x-dir*6,y:o.y+sign*2},{x:x+dir*21,y:o.y+sign*(25+i%2*7)},{x:x+dir*6,y:o.y+sign*4}]);
    }
    return pieces;
  }
  function neckShapes(o) {
    const c=center(o.y)-12,a=c-o.gap/2,b=c+o.gap/2;
    const root=(side,dy)=>({x:bounds(o.y+dy)[side]+(side===0?-26:26),y:o.y+dy});
    const left=[root(0,-110),{x:a,y:o.y-110},{x:a,y:o.y+52},{x:c-55,y:o.y+90},root(0,126),root(0,60)];
    const right=[{x:b,y:o.y-110},root(1,-110),root(1,60),root(1,126),{x:c+50,y:o.y+90},{x:b,y:o.y+52}];
    const ramp=[root(1,95),{x:c+38,y:o.y+108},{x:c-14,y:o.y+140},
      {x:c+5,y:o.y+165},root(1,194)];
    return [left,right,ramp];
  }
  const walls = [0,1].map(side=>Array.from({length:1393},(_,i)=>({x:bounds(40+i*5)[side],y:40+i*5})));
  function wallBounds(y) {
    if(y<40||y>=H)return bounds(y);
    const i=Math.floor((y-40)/5),t=(y-walls[0][i].y)/5;
    return walls.map(points=>points[i].x+(points[i+1].x-points[i].x)*t);
  }
  let branchEdge=[{x:bounds(2960)[1],y:2960},{x:607,y:3050},{x:628,y:3250},{x:626,y:3900},
    {x:616,y:4050},{x:584,y:4090},{x:550,y:4040},{x:542,y:3480},{x:518,y:3340},{x:bounds(3290)[1],y:3290}];
  for(let pass=0;pass<2;pass++) {
    const rounded=[branchEdge[0]];

        ctx.strokeStyle=art.ink;ctx.lineWidth=29;ctx.stroke();ctx.strokeStyle=art.paper;ctx.lineWidth=21;ctx.stroke();
        ctx.strokeStyle='#af83ff';ctx.lineWidth=14;ctx.stroke();
      }
    }
    for(let y=Math.max(6090,Math.ceil(top/100)*100);y<Math.min(6920,bottom+50);y+=100) {
      const [l,r]=bounds(y);
      for(const side of [-1,1]) {
        const edge=side<0?l:r,x=edge+side*38;
        ctx.beginPath();ctx.moveTo(edge,y);ctx.quadraticCurveTo(x,y+12,x+side*15,y-5);ctx.strokeStyle='#b92c87';ctx.lineWidth=5;ctx.stroke();
        drawAlveoli(x,y,14);
      }
    }
    for(let y=Math.max(3390,Math.ceil(top/105)*105);y<Math.min(5350,bottom+40);y+=105) {
      const [l,r]=bounds(y);
      for(const [x,dir] of [[l,-1],[r,1]]) {
        ctx.beginPath();ctx.moveTo(x-4*dir,y-27);ctx.bezierCurveTo(x+dir*42,y-28,x+dir*42,y+28,x-4*dir,y+27);
        ctx.strokeStyle=art.ink;ctx.lineWidth=22;ctx.stroke();ctx.strokeStyle=art.paper;ctx.lineWidth=16;ctx.stroke();
        ctx.strokeStyle='#92fff0';ctx.lineWidth=10;ctx.stroke();
      }
      ctx.beginPath();ctx.moveTo(l+13,y);ctx.quadraticCurveTo(center(y),y+11,r-13,y);ctx.strokeStyle='#9360e655';ctx.lineWidth=5;ctx.stroke();
    }
    for(let y=Math.max(1770,Math.ceil(top/160)*160);y<Math.min(3280,bottom+60);y+=160) {
      const [l,r]=bounds(y);
      for(const [x,dir] of [[l,-1],[r,1]]) {
        ctx.beginPath();ctx.moveTo(x+dir*17,y-53);ctx.bezierCurveTo(x+dir*63,y-22,x+dir*70,y+24,x+dir*18,y+58);
        ctx.strokeStyle='#b52caa';ctx.lineWidth=15;ctx.stroke();ctx.strokeStyle='#ffb8e5';ctx.lineWidth=5;ctx.stroke();
      }
    }
    for(let y=Math.max(200,Math.ceil(top/20)*20);y<Math.min(1640,bottom);y+=20) {
      const [l,r]=bounds(y),[a,b]=nasalSplit(y);
      for(const [x,dir] of [[l,1],[a,-1],[b,1],[r,-1]]) {
        ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+dir*8,y-3,x+dir*10,y-9);ctx.strokeStyle='#da682d';ctx.lineWidth=2.5;ctx.stroke();
      }
    }
  }
  function drawShelf(o,lane) {
    if(o.material==='fishbone') {
      for(const piece of fishbonePieces(o))stickerShape(piece,art.paper,3);
      const tip=shelfShape(o)[2];ctx.beginPath();ctx.arc(tip.x,tip.y,4,0,Math.PI*2);ctx.fillStyle='#ff4c77';ctx.fill();
      for(const piece of fishbonePieces(o).slice(1)) {const p=piece[1];ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fillStyle='#ff4c77';ctx.fill();}
      return;
    }
    const points=shelfShape(o,lane),nasal=o.material==='turbinate';
    if(nasal) {
      const tip=points[4],dir=lane==='right'?-1:1,root=points[0];
      stickerShape(points,'#fe76b6',7);drawTissueSurface(points,'mucosa');
      ctx.beginPath();ctx.moveTo(root.x,o.y-35);ctx.bezierCurveTo(tip.x-dir*30,o.y-72,tip.x-dir*6,o.y-24,tip.x-dir*15,o.y+24);
      ctx.bezierCurveTo(tip.x-dir*29,o.y+48,tip.x-dir*60,o.y+22,tip.x-dir*35,o.y+18);
      ctx.strokeStyle=art.ink;ctx.lineWidth=11;ctx.stroke();ctx.strokeStyle='#fff0a5';ctx.lineWidth=6;ctx.stroke();
      for(let i=1;i<5;i++) {
        const x=root.x+(tip.x-root.x)*i/6;
        ctx.beginPath();ctx.moveTo(x,o.y-42);ctx.lineTo(x+dir*11,o.y-21);ctx.strokeStyle='#ce2a86';ctx.lineWidth=4;ctx.stroke();
      }
      return;
    }
    const color={mucus:'#baf264',cartilage:'#82ecec',soft:'#baf264'}[o.material]||art.pink;
    stickerShape(points,color,6);drawTissueSurface(points,o.material==='cartilage'?'cartilage':'muscle');
    const root=points[0],tip=points[3];
    ctx.beginPath();ctx.moveTo(root.x,o.y);ctx.quadraticCurveTo((root.x+tip.x)/2,o.y-18,tip.x,o.y);ctx.strokeStyle='#70ad49';ctx.lineWidth=5;ctx.stroke();
    if(o.material==='soft')for(let i=1;i<5;i++){const t=i/5,x=root.x+(tip.x-root.x)*t;ctx.beginPath();ctx.moveTo(x,o.y-6);ctx.lineTo(x+12,o.y+18);ctx.strokeStyle='#70ad49';ctx.lineWidth=3;ctx.stroke();}
  }
  function draw(dt) {
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(scale,0,0,scale,ox,oy-camera*scale);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.fillStyle='#8b56d335';
    for(let y=Math.floor(camera/42)*42;y<camera+viewHeight;y+=42)for(let x=15;x<W;x+=42){ctx.beginPath();ctx.arc(x,y,2.3,0,Math.PI*2);ctx.fill();}
    const tissue=ctx.createLinearGradient(0,camera,0,camera+viewHeight);
    for(let i=0;i<=20;i++)tissue.addColorStop(i/20,regions[regionIndex(camera+viewHeight*i/20)].color);
    for(let side=0;side<2;side++) {
      const edge=side===0?-150:W+150;
      ctx.save();ctx.beginPath();ctx.moveTo(edge,camera-45);const p=pathWall(side,true);ctx.lineTo(edge,p.last.y);ctx.closePath();ctx.fillStyle=tissue;ctx.fill();ctx.clip();
      ctx.beginPath();pathWall(side);ctx.strokeStyle='#89299455';ctx.lineWidth=46;ctx.stroke();ctx.restore();
      ctx.beginPath();pathWall(side);ctx.strokeStyle=art.ink;ctx.lineWidth=17;ctx.stroke();ctx.strokeStyle=art.paper;ctx.lineWidth=6;ctx.stroke();
    }
    if(camera+viewHeight>6900) {
      ctx.fillStyle=regions[0].color;ctx.fillRect(-150,6900,W+300,120);
      ctx.beginPath();const [l,r]=bounds(6900);ctx.moveTo(l,6900);ctx.lineTo(r,6900);ctx.strokeStyle=art.ink;ctx.lineWidth=14;ctx.stroke();ctx.strokeStyle=art.paper;ctx.lineWidth=5;ctx.stroke();
    }
    drawStructures();drawOrganTextures();drawEsophagus();
    if(duoMode&&camera<pocket.floor+150&&camera+viewHeight>pocket.top-100) {
      ctx.fillStyle='#194574';ctx.fillRect(pocket.x-pocket.width/2+7,pocket.top,pocket.width-14,pocket.floor-pocket.top);
      stickerShape(pocketAttachment,regions[0].color,5);drawTissueSurface(pocketAttachment,'lung');
      for(const shape of pocketLining){stickerShape(shape,'#ff9ecb',3);drawTissueSurface(shape,'mucosa');}
      stickerTag(pocketRescued()?'已脫困':'回流凹袋',pocket.x,pocket.top-65,pocketRescued()?art.yellow:art.paper);
    }
    for(const impact of impacts) {
      const age=1-impact.life/.32;
      ctx.save();ctx.translate(impact.x,impact.y);ctx.rotate(Math.atan2(impact.nx,-impact.ny));ctx.globalAlpha=impact.life/.32;
      for(let i=0;i<7;i++) {const a=i*Math.PI*2/7,r=9+age*32;ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*(r+8),Math.sin(a)*(r+8));ctx.strokeStyle=art.yellow;ctx.lineWidth=4;ctx.stroke();}
      ctx.restore();
    }
    ctx.save();ctx.beginPath();airwayPath();for(const structure of structures)polygonPath(structure.points);ctx.clip('evenodd');
    for(const o of obstacles)if(o.y>camera-250&&o.y<camera+viewHeight+250) {
      if(o.kind==='shelf')for(const lane of o.material==='turbinate'?['left','right']:['left'])drawShelf(o,lane);
      else if(o.kind==='neck')for(const [i,shape] of neckShapes(o).entries()){stickerShape(shape,i===2?'#92fff0':'#ee83c9',7);drawTissueSurface(shape,i===2?'cartilage':'muscle');}
      else if(o.kind==='gate')drawVocal(o);
      else for(const b of blocks(o)) {
        ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,16);ctx.fillStyle='#c087ff';ctx.fill();ctx.strokeStyle=art.ink;ctx.lineWidth=10;ctx.stroke();ctx.strokeStyle=art.paper;ctx.lineWidth=4;ctx.stroke();
      }
    }
    moveParticles(dt);
    for(const p of particles) {
      if(p.trail.length<2)continue;
      ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);for(const point of p.trail)ctx.lineTo(point.x,point.y);ctx.lineTo(p.x,p.y);
      ctx.strokeStyle=flow>.1?`rgba(255,228,75,${p.alpha+.15})`:`rgba(107,255,247,${p.alpha+.15})`;ctx.lineWidth=3;ctx.stroke();
      ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fillStyle=art.paper;ctx.fill();
    }
    ctx.restore();
    for(const o of obstacles)if(o.y>camera+40&&o.y<camera+viewHeight-80) {
      const [a,b]=openings(o);
      stickerTag(o.name,o.material==='turbinate'?(a+b)/2:center(o.y),o.y-110,o.material==='fishbone'?'#ffd4e3':art.paper);
      ctx.font='900 13px system-ui';ctx.textAlign='center';
      if(o.kind==='neck')inkText('軟骨斜坡',center(o.y)+30,o.y+218,art.paper);
      else if(o.kind==='gate')inkText(gateGap()>bodyWidth()+6?'聲門張開':'聲門收窄',center(o.y),o.y+115,art.yellow);
      else if(o.kind==='valve') {
        const open=valveGap(o)>70;
        inkText(open?'張開':'閉合',center(o.y),o.y+70,open?art.yellow:art.paper);
        const bx=center(o.y)-70,by=o.y+93;
        ctx.fillStyle=art.ink;ctx.fillRect(bx,by,140,7);ctx.strokeStyle=art.paper;ctx.lineWidth=2;ctx.strokeRect(bx,by,140,7);
        ctx.fillStyle='#baf264';ctx.fillRect(bx+o.window[0]/1.5*140,by,(o.window[1]-o.window[0])/1.5*140,7);
        if(inhaling()){ctx.fillStyle=open?art.yellow:art.cyan;ctx.fillRect(bx+clamp(inhaleTime/1.5,0,1)*140-2,by-4,4,15);}
      }
    }
    for(const reg of regions)if(reg.top>0&&reg.top>camera+70&&reg.top<camera+viewHeight-30)stickerTag(regions[regions.indexOf(reg)+1].name,center(reg.top),reg.top,art.cyan);
    if(camera<160) {
      stickerTag('鼻腔出口',center(40),40,art.yellow);
      const [l,r]=bounds(EXIT);ctx.beginPath();ctx.moveTo(l+10,EXIT);ctx.lineTo(r-10,EXIT);ctx.setLineDash([7,9]);ctx.strokeStyle=art.yellow;ctx.lineWidth=5;ctx.stroke();ctx.setLineDash([]);
    }
    if(duoMode){
      if(pairImpact) {
        const age=1-pairImpact.life/.65;
        ctx.save();ctx.globalAlpha=(1-age)*.45;
        for(const t of pairImpact.turns){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.angle);ctx.scale(t.size,t.size);ctx.beginPath();polygonPath(outline);ctx.strokeStyle=t.color;ctx.lineWidth=5;ctx.stroke();ctx.restore();}
        ctx.globalAlpha=1-age;
        for(let i=0;i<8;i++){const a=i*Math.PI/4,r=8+age*30;ctx.beginPath();ctx.moveTo(pairImpact.x+Math.cos(a)*r,pairImpact.y+Math.sin(a)*r);ctx.lineTo(pairImpact.x+Math.cos(a)*(r+10),pairImpact.y+Math.sin(a)*(r+10));ctx.strokeStyle=i%2?art.cyan:art.yellow;ctx.lineWidth=4;ctx.stroke();}
        stickerTag(pairImpact.turning?'翻轉':'碰撞',pairImpact.x,pairImpact.y-45-age*20,art.paper);ctx.restore();
      }
      for(const b of bodies)if(!b.escaped) {
        drawCharacter(b);
        const t=pairImpact?.turns.find(t=>t.name===b.name);
        if(t&&Math.abs(t.spin)>.5&&Math.abs(b.omega)>.05) {
          const sign=Math.sign(b.omega),r=BR*b.size+8,start=b.angle+.3,end=start+sign*1.9;
          ctx.save();ctx.globalAlpha=pairImpact.life/.65;ctx.strokeStyle=art.cyan;ctx.lineWidth=3;
          ctx.beginPath();ctx.arc(b.x,b.y,r,start,end,sign<0);ctx.stroke();
          const x=b.x+Math.cos(end)*r,y=b.y+Math.sin(end)*r,a=end+sign*Math.PI/2;
          ctx.beginPath();ctx.moveTo(x-8*Math.cos(a-.55),y-8*Math.sin(a-.55));ctx.lineTo(x,y);ctx.lineTo(x-8*Math.cos(a+.55),y-8*Math.sin(a+.55));ctx.stroke();ctx.restore();
        }
      }
    }
    else if(!won) {
      ctx.save();ctx.translate(body.x,body.y);ctx.rotate(body.angle);
      stickerShape(outline,bumpFlash>0?art.paper:art.yellow,6);
      ctx.beginPath();ctx.moveTo(-15,-4);ctx.lineTo(-7,-10);ctx.lineTo(5,-8);ctx.strokeStyle='#ffbc3c';ctx.lineWidth=2;ctx.stroke();
      for(const x of [-7,6]) {
        ctx.beginPath();ctx.ellipse(x,-3,4.7,5.8,0,0,Math.PI*2);ctx.fillStyle=art.ink;ctx.fill();
        ctx.beginPath();ctx.arc(x-1.2,-5,1.5,0,Math.PI*2);ctx.fillStyle=art.paper;ctx.fill();
      }
      for(const x of [-13,12]){ctx.beginPath();ctx.ellipse(x,5,3.4,2,0,0,Math.PI*2);ctx.fillStyle=art.pink;ctx.fill();}
      ctx.fillStyle=art.ink;
      if(breathPhase==='gasp'){ctx.beginPath();ctx.ellipse(0,7,3.5,4,0,0,Math.PI*2);ctx.fill();}
      else {ctx.beginPath();ctx.moveTo(-6,5);ctx.quadraticCurveTo(0,14,6,5);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-4,6);ctx.lineTo(4,6);ctx.strokeStyle=art.paper;ctx.lineWidth=2;ctx.stroke();}
      ctx.restore();
      if(hurtFlash>0){ctx.beginPath();ctx.arc(body.x,body.y,BR+9,0,Math.PI*2);ctx.strokeStyle='#ff4c77';ctx.lineWidth=5;ctx.stroke();}
    }
    if(hurtFlash>0){ctx.fillStyle=`rgba(255,69,127,${hurtFlash*.3})`;ctx.fillRect(-150,camera,W+300,viewHeight);}
    ctx.setTransform(scale,0,0,scale,ox,oy);const mapX=W+Math.max(0,ox/scale-24),top=120,mapH=viewHeight-240;
    ctx.beginPath();ctx.moveTo(mapX,top);ctx.lineTo(mapX,top+mapH);ctx.strokeStyle='#b58de3';ctx.lineWidth=4;ctx.stroke();
    for(const reg of regions){const y=top+(reg.top+reg.bottom)/2/H*mapH;ctx.beginPath();ctx.arc(mapX,y,5,0,Math.PI*2);ctx.fillStyle=reg.color;ctx.fill();ctx.strokeStyle=art.paper;ctx.lineWidth=2;ctx.stroke();if(ox/scale>95){ctx.font='900 11px system-ui';ctx.textAlign='right';inkText(reg.name,mapX-12,y+4);}}
    for(const b of duoMode?bodies:[body]){ctx.beginPath();ctx.arc(mapX,top+b.y/H*mapH,8,0,Math.PI*2);ctx.fillStyle=b.color||art.yellow;ctx.fill();ctx.strokeStyle=art.paper;ctx.lineWidth=3;ctx.stroke();}
  }
  function frame(now) {
    const dt=lastTime?Math.min((now-lastTime)/1000,.05):0;lastTime=now;
    accumulator+=dt;while(accumulator>=STEP){step(STEP);accumulator-=STEP;}
    scale=Math.min(canvas.width/W,canvas.height/viewHeight);ox=(canvas.width-W*scale)/2;oy=(canvas.height-viewHeight*scale)/2;
    draw(dt);updateUI();requestAnimationFrame(frame);
  }
  function release(){heldKeys=false;heldPointer=null;}
  $('breath').addEventListener('pointerdown',e=>{if(e.button!==0||heldPointer!==null)return;if(won||failed)restart();heldPointer=e.pointerId;begin();$('breath').setPointerCapture(e.pointerId);e.preventDefault();});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])$('breath').addEventListener(event,e=>{if(e.pointerId===heldPointer)heldPointer=null;});
  $('breath').addEventListener('click',e=>{if(e.detail===0&&!heldKeys){if(won||failed)restart();begin();heldKeys=true;setTimeout(()=>{heldKeys=false;},180);}});
  window.addEventListener('keydown',e=>{if(e.code!=='Space'||e.target===$('again')||e.target===$('reset')||e.target===$('practice')||e.target===$('duo'))return;e.preventDefault();if(e.repeat)return;if(won||failed)restart();heldKeys=true;begin();});
  window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();heldKeys=false;}});
  window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden){release();lastTime=0;}});
  $('duo').addEventListener('click',()=>{startDuo();$('breath').focus();});$('reset').addEventListener('click',reset);$('practice').addEventListener('click',()=>{startPractice();$('breath').focus();});$('again').addEventListener('click',()=>{restart();$('breath').focus();});
  new ResizeObserver(resize).observe(canvas);reset();if(new URLSearchParams(location.search).has('practice'))startPractice();if(new URLSearchParams(location.search).has('duo'))startDuo();resize();requestAnimationFrame(frame);
  if(new URLSearchParams(location.search).has('test'))window.flowTest={
    get state(){return {body:{...body},air,flow,running,won,failed,irritation,injuries,hurtCooldown,failureReason,elapsed,collisions,held:held(),camera,cleared:[...cleared],region:regionIndex(body.y),inhaleTime,nasalLane,viewHeight,breathPhase,breathTime,gasps,practiceMode,duoMode,bodies:bodies.map(b=>({...b})),pairContacts,pairTurns,pairImpact:pairImpact?{...pairImpact,turns:pairImpact.turns.map(t=>({...t}))}:null};},
    reset,advance(seconds,pairEnabled=true){for(let i=0;i<Math.round(seconds/STEP);i++)step(STEP,pairEnabled);updateUI();},bounds,center,radius:BR,start:START,height:H,view:VIEW,obstacles,
    startDuo,pocket,pocketRects,pocketShapes,inPocket,pocketRescued,pairManifold,collidePair,bodyInertia,applyAirDrag,integrateBody,
    seedDuo(states){startDuo();states.forEach((b,i)=>Object.assign(bodies[i],b));running=true;},
    bodyPoints,outline,inertia,support,collide,collidePolygon,collideRect,wallBounds,openings,gateGap,blocks,side:obstacleSide,structures,shelfShape,fishbonePieces,vocalShapes,neckShapes,esophagus,inEsophagus,inAirway,regions,velocityAt,inSolid,prick,
    seedBody(state,initialAir=1){reset();Object.assign(body,state);air=clamp(initialAir,0,1);breathStartAir=air;if(air<1)breathPhase='inhale';running=true;camera=clamp(body.y-viewHeight*.62,0,H-viewHeight);updateUI();},
    particleStats(){return particles.map(p=>({x:p.x,y:p.y,trail:p.trail.length}));},
    input(value){heldKeys=value;begin();}
  };
})();
</script>
